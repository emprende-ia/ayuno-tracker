<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ayuno 16:8</title>
  <meta name="description" content="Registro diario y semanal de ayuno 16:8 sin cena, con ayuno intenso de viernes a sábado, rachas y protectores.">
  <meta name="theme-color" content="#f7fbf0">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <link rel="icon" href="icons/favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-48.png?v=2" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ayuno">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=bedtime,bolt,brightness_auto,calendar_view_week,check,close,cloud_done,cloud_off,cloud_sync,dark_mode,delete,download,edit,emoji_events,expand_more,history,info,light_mode,local_fire_department,login,logout,question_mark,restaurant,schedule,settings,shield,sync_problem,today,upload,weekend&display=block">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Aplica el tema guardado antes de pintar para evitar parpadeo
    try {
      var t = JSON.parse(localStorage.getItem('ayuno-tracker/v1') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#view">Saltar al contenido</a>
  <div class="app">
    <header class="top-bar" id="topbar">
      <div class="top-titles">
        <h1 id="title">Hoy</h1>
        <p id="subtitle"></p>
      </div>
      <div class="top-actions">
        <button class="icon-btn sync-btn" id="sync-btn" type="button" data-act="settings" aria-label="Sincronización" hidden></button>
        <button class="icon-btn" id="theme-btn" type="button" data-act="theme" aria-label="Cambiar tema"></button>
        <button class="icon-btn" type="button" data-act="settings" aria-label="Ajustes"><span class="ms" aria-hidden="true">settings</span></button>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="nav-bar" aria-label="Secciones">
      <a class="nav-item" href="#hoy" data-view="hoy"><span class="nav-ind"><span class="ms" aria-hidden="true">today</span></span><span class="nav-label">Hoy</span></a>
      <a class="nav-item" href="#semana" data-view="semana"><span class="nav-ind"><span class="ms" aria-hidden="true">calendar_view_week</span></span><span class="nav-label">Semana</span></a>
      <a class="nav-item" href="#horario" data-view="horario"><span class="nav-ind"><span class="ms" aria-hidden="true">schedule</span></span><span class="nav-label">Horario</span></a>
    </nav>
  </div>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="snackbar" class="snackbar" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Esta app necesita JavaScript para funcionar.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
